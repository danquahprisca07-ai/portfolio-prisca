<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio – Prisca | Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contact.css">
    <script defer src="script.js"></script>
    <script defer src="contact.js"></script>
</head>
<body>
<header>
    <nav class="navbar">
        <h1 class="logo">Prisca<span>.</span></h1>
        <ul class="nav-links">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="about.html">À propos</a></li>
            <li><a href="skills.html">Compétences</a></li>
            <li><a href="projects.html">Projets</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
        <div class="toggle-dark"></div>
    </nav>
</header>

<section class="contact">
    <div class="contact-info">
        <h2 class="section-title">Me contacter</h2>
        <p class="section-subtitle">N’hésite pas à m’écrire pour toute question ou collaboration.</p>

        <p><strong>Email :</strong> danquahprisca07@gmail.com</p>
        <p><strong>Ville :</strong> Dakar, Sénégal</p>
    </div>

    <form class="contact-form" id="contactForm" novalidate>
        <div class="field">
            <label for="name">Nom complet</label>
            <input type="text" id="name" required>
            <small class="error"></small>
        </div>

        <div class="field">
            <label for="email">Adresse email</label>
            <input type="email" id="email" required>
            <small class="error"></small>
        </div>

        <div class="field">
            <label for="message">Message</label>
            <textarea id="message" rows="4" required></textarea>
            <small class="error"></small>
        </div>

        <button type="submit" class="btn primary">Envoyer</button>
        <p class="form-success" id="formSuccess"></p>
    </form>
</section>
</body>
</html>
